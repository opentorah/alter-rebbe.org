plugins {
  id 'idea'
  id 'scala'
  id 'org.podval.conventions'
  id 'org.podval.tools.site-publisher' version '0.5.0'
}

// Gradle 9.8.1 still defaults Zinc to 1.12.0.
scala.zincVersion = '1.12.1'

description = '19 Kislev Archive'

idea {
  module {
    excludeDirs += [
      file('.idea'),
      file('gradle')
    ]
  }
}

// There is no Java in the project :)
project.gradle.startParameter.excludedTaskNames.add('compileJava')

site {
  treatErrorsAsWarnings = true
  production = true
}
