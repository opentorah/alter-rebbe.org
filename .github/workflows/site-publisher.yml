name: Deploy Podval Site Publisher site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Generate Site
        uses: dubinsky/site-publisher/.github/actions/generate@master
        id: site
        with:
          source: '.'
          treat-errors-as-warnings: true

      - name: Upload GitHub Pages from './_site' as an Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.site.outputs.site-path }}

      - name: Deploy collection-alias Worker
        uses: dubinsky/site-publisher/.github/actions/deploy-alias-worker@master
        with:
          site-path: ${{ steps.site.outputs.site-path }}
          hostname: ng.alter-rebbe.org
          zone-name: alter-rebbe.org
          account-id: d69a5ee09b435e24288432ec02f45629
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          worker-name: ng-alter-rebbe-aliases

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
